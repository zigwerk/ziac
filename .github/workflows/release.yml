name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install native dependencies on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libssl-dev
      - name: Install native dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install libpq openssl@3
      - run: bun install --frozen-lockfile
      - name: Build paired Ziac and ZigEffect CLI distribution
        working-directory: packages/ziac
        run: zig build install -Doptimize=ReleaseSafe --summary all
      - name: Package and verify distribution
        run: |
          scripts/package_distribution.sh "${GITHUB_REF_NAME#v}" packages/ziac/zig-out dist/release
          scripts/test_distribution_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ziac-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ziac-*
          path: dist/release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Ziac $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
